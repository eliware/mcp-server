version: "15.0"
description: Defines requirements for server authentication and authorization.
directives:
  - id: E-210.2
    dos:
      - Support servers without MCP authentication.
      - Support static bearer tokens for basic protected servers.
      - Keep OAuth and custom authorization in optional focused modules.
      - Apply authentication before the MCP endpoint processes each request.
      - Keep authorization rules separate from MCP protocol rules.
      - Pass validated authentication data to each tool context.
      - Preserve request metadata when a request has no validated authentication data.
      - Remove caller-supplied authentication metadata before the MCP handler uses it.
      - Return OAuth state so consumers can associate callbacks with user sessions.
      - Associate callback state with a session value before redirecting the user.
      - Compare callback state with the saved session value before exchanging a code.
      - Store each PKCE verifier and session value with its state.
      - Consume each PKCE record once after its session value matches.
      - Preserve each PKCE record when its session value does not match.
      - Require custom stores to validate the session and remove matching records atomically.
      - Allow consumers to supply custom PKCE storage for requests across processes.
      - Require OAuth issuer values to come from trusted application configuration.
      - Return authentication errors without exposing tokens or private claims.
      - Require HTTPS for OAuth issuer and introspection endpoints.
      - Require HTTPS for authorization, registration, and token endpoints.
    donts:
      - Do not require consumers to set up OAuth in the basic path.
      - Do not write credentials, access tokens, or private claims to logs.
