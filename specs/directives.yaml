version: "12.0"
description: Defines requirements for the Eliware MCP server package.
directives:
  - id: E-210.0
    dos:
      - Keep public runtime code and declarations under src/.
      - Support HTTP, HTTPS, and stdio transports as documented.
      - Require the selected authentication mode for access.
      - Pass configured context values to each registered tool.
    donts:
      - Do not expose credentials in responses or logs.
      - Do not write MCP protocol output to stdout in stdio mode.
    children:
      - id: E-210.0.0
        dos:
          - Require each tool file to use the .mjs extension.
          - Require each tool file to export one default registration function.
        donts:
          - Do not load files with other extensions as tools.
      - id: E-210.0.1
        dos:
          - Include only required runtime files, docs, examples, and specs in the package.
          - Check package contents before release.
        donts:
          - Do not include credentials, certificates, or test output in the package.
