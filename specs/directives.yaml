version: "14.0"
description: Defines shared requirements for the Eliware MCP server package.
directives:
  - id: E-210.0
    dos:
      - Keep the public API small and document each supported option.
      - Use the official MCP TypeScript SDK v2 packages.
      - Use Fastify as the only supported web framework.
      - Support Streamable HTTP and stdio transports.
      - Require the modern MCP protocol revision 2026-07-28.
      - Keep each source module focused on one responsibility.
      - Inject external services and effects when this makes modules easier to test.
      - Pass configured context values to each registered tool.
    donts:
      - Do not depend on Express or the v1 MCP SDK.
      - Do not support the deprecated HTTP with SSE transport.
      - Do not accept earlier MCP protocol revisions.
      - Do not expose credentials in responses or logs.
      - Do not write MCP protocol output to stdout in stdio mode.
    children:
      - id: E-210.0.0
        dos:
          - Require each tool module to use the .mjs extension.
          - Require each tool module to export one default registration function.
          - Keep each tool module in tools/<name>.mjs.
        donts:
          - Do not load files with other extensions as tools.
          - Do not load unrelated files from the consumer application.
      - id: E-210.0.1
        dos:
          - Keep public runtime code and declarations under src/.
          - Mirror each source module with one test module.
          - Limit each source module to 100 lines.
          - Limit each test module to 200 lines.
          - Include required runtime files and metadata in the npm package.
          - Check package contents before release.
        donts:
          - Do not include credentials, certificates, or test output in the package.
